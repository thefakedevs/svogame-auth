[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.48", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
urlencoding = "2.1"
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "with-uuid", "macros"] }
sea-orm-migration = "1.1"
chrono = "0.4"
async-trait = "0.1"
rand = "0.9"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
jwt = "0.16"
hmac = "0.12"
uuid = { version = "1.19", features = ["v4"] }

