name: Build And Push Containers

on:
  push:
    branches:
      - production
      - stage
  workflow_dispatch:

concurrency:
  group: containers-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image_name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/svogame-auth-${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

  deploy:
    name: Trigger deploy webhook
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    env:
      DEPLOY_WEBHOOK_TOKEN: ${{ github.ref_name == 'stage' && secrets.DEPLOY_WEBHOOK_TOKEN_STAGE || secrets.DEPLOY_WEBHOOK_TOKEN }}

    steps:
      - name: Call deploy webhook
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: $DEPLOY_WEBHOOK_TOKEN" \
            -H "X-Deploy-Ref: ${{ github.ref }}" \
            -d '{}' \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}"
