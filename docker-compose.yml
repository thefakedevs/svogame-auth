version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - RUST_BACKTRACE=1
      - BINDING_ADDRESS=0.0.0.0:3000
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/db.sqlite?mode=rwc}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - JWT_SECRET=${JWT_SECRET}
      - POW_COMPLEXITY=${POW_COMPLEXITY:-19}
      - GAMERVII_COMPAT_ENABLED=${GAMERVII_COMPAT_ENABLED:-false}
      - GAMERVII_COMPAT_ENDPOINT=${GAMERVII_COMPAT_ENDPOINT}
      - GAMERVII_COMPAT_TOKEN=${GAMERVII_COMPAT_TOKEN}
      - DISCORD_PROXY=${DISCORD_PROXY}
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-3017}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    external: true
    name: svo-server-${BRANCH:-local}
